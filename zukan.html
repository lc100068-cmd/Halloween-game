<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="写真と質問の答えから、ハロウィンのモンスター図鑑カードを作るAIの呪文（プロンプト）を組み立てます。">
<meta name="theme-color" content="#1b1428">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>AIモンスター図鑑</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@400;500;700&family=DotGothic16&display=swap">
<style>
/* Layout: 一枚の「図鑑の見開き」— 左に呪文を書く台帳、右に完成した呪文（プロンプト）。スマホでは縦に積む。
   夜の屋台の一色世界（ダーク固定）。アクセントは提灯のろうそく色。 */
:root{
  --night:#1b1428;      /* 背景：夜空の紫 */
  --panel:#261c38;      /* 台帳の紙 */
  --ink:#f3ecff;        /* 文字 */
  --mute:#a99bc4;       /* 補足 */
  --line:#3d3056;       /* 罫線 */
  --candle:#ffb547;     /* 提灯のろうそく */
  --slime:#8fe3c0;      /* 呪文の光 */
  --berry:#ff7ab6;      /* ソング用（切り替えバー） */
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --mono:"DotGothic16","Osaka-Mono",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--night);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7;
  background-image:radial-gradient(circle at 85% -10%,rgba(255,181,71,.18),transparent 40%),radial-gradient(circle at 0% 100%,rgba(143,227,192,.08),transparent 45%);}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:28px 60px;display:flex;flex-direction:column;gap:28px}
header{display:flex;flex-direction:column;gap:8px}
/* アプリ切り替えバー：どのページでも上に固定。今いるアプリはアクセント色で塗る */
.appnav{position:sticky;top:0;z-index:10;background:rgba(27,20,40,.92);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.appnav-in{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;gap:8px}
.appnav a{--accent:var(--mute);flex:1 1 0;min-width:0;min-height:44px;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);border-radius:12px;color:var(--ink);text-decoration:none;font-weight:700;font-size:14px;white-space:nowrap}
.appnav a i{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:0 0 auto}
.appnav a.home{flex:0 0 44px;color:var(--mute)}
.appnav a.home svg{width:20px;height:20px}
.appnav .to-zukan{--accent:var(--candle)}
.appnav .to-quiz{--accent:var(--slime)}
.appnav .to-song{--accent:var(--berry)}
.appnav a:hover{border-color:var(--accent)}
.appnav a[aria-current=page]{background:var(--accent);border-color:var(--accent);color:#241a08}
.appnav a[aria-current=page] i{background:#241a08}
.appnav a:focus-visible{outline:2px solid var(--slime);outline-offset:2px}
.eyebrow{font-family:var(--mono);color:var(--candle);letter-spacing:.12em;font-size:13px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,6vw,52px);line-height:1.15;margin:0;text-wrap:balance}
h1 span{color:var(--candle);white-space:nowrap}
.lead{color:var(--mute);margin:0;max-width:60ch}
.steps{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0;margin:4px 0 0}
.steps li{font-size:13px;border:1px solid var(--line);border-radius:999px;padding:4px 12px;color:var(--mute)}
.steps b{color:var(--candle);font-family:var(--mono);font-weight:400;margin-right:6px}

.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}

.book{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:20px}
.book h2{font-family:var(--display);font-weight:400;font-size:20px;margin:0;display:flex;align-items:baseline;gap:10px}
.book h2 small{font-family:var(--mono);font-size:12px;color:var(--mute)}

fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:8px;min-width:0}
legend,label.lbl{font-weight:700;font-size:14px;margin-bottom:6px;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips input{position:absolute;opacity:0;pointer-events:none}
.chips label{border:1px solid var(--line);border-radius:10px;padding:7px 12px;cursor:pointer;font-size:14px;transition:.15s;user-select:none}
.chips label:hover{border-color:var(--mute)}
.chips input:checked+label{background:var(--candle);color:#241a08;border-color:var(--candle);font-weight:700}
.chips input:focus-visible+label{outline:2px solid var(--slime);outline-offset:2px}

.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:480px){.row{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;min-width:0}
input[type=text]{width:100%;background:var(--night);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit;font-size:15px}
input[type=text]:focus{outline:2px solid var(--slime);border-color:transparent}
.hint{font-size:12px;color:var(--mute);margin-top:4px}
.sugg{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sugg button{background:transparent;border:1px dashed var(--line);color:var(--mute);border-radius:999px;padding:3px 10px;font:inherit;font-size:13px;cursor:pointer}
.sugg button:hover{border-color:var(--slime);color:var(--slime)}
.sugg button:focus-visible{outline:2px solid var(--slime);outline-offset:2px}
.sugg span{font-size:12px;color:var(--mute);align-self:center}

/* 出力側 */
.out{position:sticky;top:calc(env(safe-area-inset-top,0px) + 81px);display:flex;flex-direction:column;gap:16px}
@media (max-width:820px){.out{position:static}}
.card{background:linear-gradient(160deg,#2f2345,#221932);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:14px}
.card-top{display:flex;gap:14px;align-items:center}
.no{font-family:var(--mono);color:var(--candle);font-size:13px}
.mname{font-family:var(--display);font-size:24px;line-height:1.2;margin:0}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:2px 8px;color:var(--mute)}

.tabs{display:flex;gap:6px}
.tabs button{flex:1;background:transparent;border:1px solid var(--line);color:var(--mute);border-radius:10px;padding:8px;font:inherit;font-size:14px;cursor:pointer}
.tabs button[aria-selected=true]{border-color:var(--slime);color:var(--slime);font-weight:700}
.tabs button:focus-visible{outline:2px solid var(--slime);outline-offset:2px}

.spell{background:var(--night);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:14px;line-height:1.75;white-space:pre-wrap;word-break:break-word;max-height:360px;overflow:auto;color:var(--ink)}
.spell mark{background:transparent;color:var(--slime);font-weight:700}

.actions{display:flex;flex-wrap:wrap;gap:10px}
.btn{border:0;border-radius:12px;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer;font-size:15px}
.btn.primary{background:var(--candle);color:#241a08;flex:1 1 180px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);flex:1 1 140px}
.btn:focus-visible{outline:2px solid var(--slime);outline-offset:2px}
.toast{font-size:13px;color:var(--slime);min-height:1.2em;margin:0}

.howto{font-size:13px;color:var(--mute);margin:0;padding-left:1.2em}
.howto li{margin-bottom:2px}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<nav class="appnav" aria-label="アプリの切り替え">
  <div class="appnav-in">
    <a class="home" href="index.html" aria-label="トップ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg></a>
    <a class="to-zukan" href="zukan.html" aria-current="page"><i></i>図鑑</a>
    <a class="to-quiz" href="quiz.html"><i></i>クイズ</a>
    <a class="to-song" href="song.html"><i></i>ソング</a>
  </div>
</nav>


<div class="wrap">
  <header>
    <div class="eyebrow">HALLOWEEN AI LAB ／ 呪文工房</div>
    <h1>大切な誰かを<span>モンスター</span>にしよう</h1>
    <p class="lead">質問に答えるだけ。画像生成AIに渡す「呪文（プロンプト）」ができあがります。</p>
    <ol class="steps">
      <li><b>1</b>質問にこたえる</li>
      <li><b>2</b>呪文をコピー</li>
      <li><b>3</b>写真と一緒にAIへ</li>
    </ol>
  </header>

  <div class="grid">
    <!-- 入力：台帳 -->
    <form class="book" id="form" autocomplete="off">
      <h2>呪文の台帳 <small>ENTRY</small></h2>

      <fieldset>
        <legend>だれをモンスターにする？</legend>
        <div class="chips" data-name="who"></div>
      </fieldset>

      <fieldset id="speciesBox">
        <legend>どんな動物？</legend>
        <div class="chips" data-name="species"></div>
      </fieldset>

      <div class="field">
        <label class="lbl" for="name" id="nameLbl">呼び名</label>
        <input type="text" id="name" maxlength="16">
        <div class="sugg" data-for="name"></div>
      </div>

      <div class="field">
        <label class="lbl" for="food">好きな食べもの</label>
        <input type="text" id="food" maxlength="20">
        <div class="sugg" data-for="food"></div>
      </div>

      <div class="field">
        <label class="lbl" for="habit" id="habitLbl">くせ・得意なこと</label>
        <input type="text" id="habit" maxlength="40">
        <div class="sugg" data-for="habit"></div>
      </div>

      <fieldset>
        <legend>性格</legend>
        <div class="chips" data-name="personality"></div>
      </fieldset>

      <fieldset>
        <legend>モンスターのタイプ</legend>
        <div class="chips" data-name="kind"></div>
      </fieldset>

      <fieldset>
        <legend>ぞくせい</legend>
        <div class="chips" data-name="element"></div>
      </fieldset>

      <fieldset>
        <legend>絵のタッチ</legend>
        <div class="chips" data-name="style"></div>
      </fieldset>
    </form>

    <!-- 出力：図鑑カード -->
    <section class="out" aria-label="できあがった呪文">
      <div class="card">
        <div class="card-top">
          <div>
            <div class="no" id="no">No.031</div>
            <p class="mname" id="mname">こむぎ</p>
          </div>
        </div>
        <div class="tags" id="tags"></div>

        <div class="tabs" role="tablist">
          <button type="button" role="tab" id="tab-ja" aria-selected="true">日本語の呪文</button>
          <button type="button" role="tab" id="tab-en" aria-selected="false">英語の呪文</button>
        </div>
        <div class="spell" id="spell" tabindex="0"></div>

        <div class="actions">
          <button class="btn primary" type="button" id="copy">呪文をコピー</button>
          <button class="btn ghost" type="button" id="swap">1語だけ変える</button>
        </div>
        <p class="toast" id="toast" aria-live="polite"></p>

        <ol class="howto">
          <li>ChatGPT や Gemini を開き、写真を添付する</li>
          <li>コピーした呪文を貼り付けて送信</li>
          <li>「1語だけ変える」で作り直すと、結果の違いがわかります</li>
        </ol>
      </div>
    </section>
  </div>
</div>

<script>
// ===== 共通の選択肢 =====
const WHO = [
  {ja:"家族", key:"family"},
  {ja:"友達", key:"friend"},
  {ja:"ペット", key:"pet"}
];
const KIND = [["オバケ","ghost"],["ヴァンパイア","vampire"],["魔女・魔法使い","witch / wizard"],["ジャック・オ・ランタン","jack-o'-lantern creature"],["ミイラ","mummy"],["おおかみ男","werewolf"]];
const ELEMENT = [["ほのお","fire"],["こおり","ice"],["やみ","darkness"],["おかし","candy"],["かみなり","lightning"],["ほし","starlight"]];
const STYLE = [["水彩えほん","soft watercolor picture-book illustration"],["ゲームのドット絵","16-bit pixel art"],["ゆるキャラ","cute chibi mascot illustration"],["ちょっとこわい油絵","slightly spooky oil painting"],["フィギュア風3D","glossy 3D collectible figure"]];
const SPECIES = [["犬","dog"],["猫","cat"],["うさぎ","rabbit"],["ハムスター","hamster"],["鳥","bird"],["その他","small animal"]];

// ===== だれを選んだかで変わる中身 =====
const PRESET = {
  family:{
    nameLbl:"呼び名（パパ・おばあちゃん など）",
    habitLbl:"くせ・得意なこと・家での名物",
    name:"おばあちゃん", food:"おはぎ", habit:"電話がとにかく長い",
    names:["パパ","ママ","おじいちゃん","おねえちゃん"],
    foods:["カレー","お味噌汁","ショートケーキ","焼きいも"],
    habits:["朝いちばんに起きる","ダジャレを言う","料理がうまい","リモコンをすぐなくす","寝言が大きい"],
    personality:[["やさしい","kind-hearted"],["しっかり者","dependable"],["ダジャレ好き","pun-loving"],["しんぱい性","worrywart"],["おおらか","easygoing"],["怒るとこわい","scary when angry but loving"]],
    def:{personality:0, kind:2, element:5, style:0},
    keep:"髪型・メガネ・よく着る服の色など、家族が見て「あの人だ！」とわかる特徴",
    extra:"家族へのひとこと：このモンスターが家族に言いそうな、あたたかいセリフを1つ",
    extraEn:"A message to the family: one warm line this monster would say to its family",
    mood:"家族で見てほっこり笑える雰囲気"
  },
  friend:{
    nameLbl:"あだ名",
    habitLbl:"くせ・得意なこと・名物エピソード",
    name:"ゆうくん", food:"ラーメン", habit:"ゲームで負けると必ず再戦を申し込む",
    names:["たっちゃん","みーちゃん","リーダー","せんぱい"],
    foods:["からあげ","タピオカ","ポテト","焼肉"],
    habits:["集合時間にいつも遅れる","写真を撮るのがうまい","カラオケで必ず同じ曲","話を盛りがち","だれとでもすぐ仲良くなる"],
    personality:[["お調子者","playful joker"],["負けずぎらい","super competitive"],["マイペース","laid-back"],["ムードメーカー","life of the party"],["クール","cool and calm"],["さみしがり","secretly lonely"]],
    def:{personality:1, kind:1, element:4, style:1},
    keep:"髪型・表情のくせ・よく着る服など、友達が見て「あいつだ！」とわかる特徴",
    extra:"相棒へのひとこと：このモンスターが友達に言いそうな、ノリのいいセリフを1つ",
    extraEn:"A line to its best friend: one fun, upbeat line this monster would say",
    mood:"友達同士で見せあって盛り上がる雰囲気"
  },
  pet:{
    nameLbl:"ペットの名前",
    habitLbl:"くせ・得意なこと・かわいいところ",
    name:"こむぎ", food:"さつまいも", habit:"お昼寝をすると3時間起きない",
    names:["ポチ","ミケ","ココ","もち"],
    foods:["ささみ","ちゅ〜る","キャベツ","ひまわりの種"],
    habits:["ごはんの時間を正確に知らせる","ボールを追いかけるのが速い","おなかを見せて寝る","インターホンに必ず反応する","ひざの上から動かない"],
    personality:[["くいしんぼう","gluttonous"],["あまえんぼう","cuddly and clingy"],["いたずら好き","mischievous"],["こわがり","timid"],["ねぼすけ","sleepy"],["きまぐれ","moody and whimsical"]],
    def:{personality:0, kind:3, element:3, style:2},
    keep:"毛の色・模様・耳やしっぽの形など、飼い主が見て「うちの子だ！」とわかる特徴",
    extra:"飼い主へのひとこと：このモンスターが飼い主に言いそうな、かわいいセリフを1つ",
    extraEn:"A message to its owner: one adorable line this monster would say",
    mood:"かわいくて、飼い主が思わず笑顔になる雰囲気"
  }
};

const $ = id=>document.getElementById(id);
let lang="ja";
let whoKey="pet";
const state={};

// ===== チップを描く =====
function renderChips(name, list, checkedIndex){
  const box=document.querySelector(`.chips[data-name=${name}]`);
  box.innerHTML="";
  list.forEach((opt,i)=>{
    const id=`${name}-${i}`;
    const inp=document.createElement("input");
    inp.type="radio"; inp.name=name; inp.id=id; inp.value=i;
    if(i===checkedIndex) inp.checked=true;
    const lab=document.createElement("label");
    lab.htmlFor=id; lab.textContent=Array.isArray(opt)?opt[0]:opt.ja;
    box.append(inp,lab);
  });
}
function check(name,i){ const el=$(`${name}-${i}`); if(el) el.checked=true; }

renderChips("who", WHO, 2);
renderChips("kind", KIND, 0);
renderChips("element", ELEMENT, 0);
renderChips("style", STYLE, 0);
renderChips("species", SPECIES, 0);

// ===== 候補ボタン =====
function renderSugg(field, words){
  const box=document.querySelector(`.sugg[data-for=${field}]`);
  box.innerHTML="<span>例：</span>";
  words.forEach(w=>{
    const b=document.createElement("button");
    b.type="button"; b.textContent=w;
    b.onclick=()=>{ $(field).value=w; build(); };
    box.append(b);
  });
}

// ===== だれを選んだときの切り替え =====
let prevPreset=null;
function applyWho(key){
  const p=PRESET[key];
  // 前の例文のまま、または空欄なら新しい例に差し替える（自分で書いた内容は残す）
  ["name","food","habit"].forEach(f=>{
    const v=$(f).value.trim();
    if(!v || (prevPreset && v===prevPreset[f])) $(f).value=p[f];
  });
  $("nameLbl").textContent=p.nameLbl;
  $("habitLbl").textContent=p.habitLbl;
  renderSugg("name",p.names);
  renderSugg("food",p.foods);
  renderSugg("habit",p.habits);
  renderChips("personality",p.personality,p.def.personality);
  check("kind",p.def.kind); check("element",p.def.element); check("style",p.def.style);
  $("speciesBox").hidden = key!=="pet";
  prevPreset=p;
}

function read(){
  const get=k=>{const c=document.querySelector(`input[name=${k}]:checked`);return Number(c?c.value:0);};
  whoKey=WHO[get("who")].key;
  state.personality=get("personality");
  state.kind=get("kind"); state.element=get("element"); state.style=get("style");
  state.species=get("species");
  state.name=$("name").value.trim()||"なまえ";
  state.food=$("food").value.trim()||"おかし";
  state.habit=$("habit").value.trim()||"よく笑う";
}

function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function m(s){return `<mark>${esc(s)}</mark>`}
function hashNo(){
  const s=state.name+state.kind+state.element+whoKey;
  let h=0; for(const ch of s) h=(h*31+ch.charCodeAt(0))%997;
  return "No."+String(h+1).padStart(3,"0");
}

function build(){
  read();
  const p=PRESET[whoKey], s=state;
  const per=p.personality[s.personality]||p.personality[0];
  const kind=KIND[s.kind], el=ELEMENT[s.element], st=STYLE[s.style], sp=SPECIES[s.species];
  const isPet=whoKey==="pet";
  const subjJa=isPet?`${sp[0]}`:(whoKey==="family"?"家族":"友達");
  const subjEn=isPet?sp[1]:(whoKey==="family"?"family member":"friend");

  const ja=
`添付した写真の${m(subjJa)}をモデルに、ハロウィンの「モンスター図鑑」のカードを作ってください。

【絵について】
・${p.keep}を残す
・${m(kind[0])}のモンスターに変身させる
・ぞくせいは${m(el[0])}。その力が体のまわりに見えるように
・性格は${m(per[0])}。表情やポーズで表す
・タッチは${m(st[0])}
・背景はハロウィンの夜。${p.mood}
・カードゲームのカードのような縦長の画像（縦横比 5:7、トレーディングカードサイズ）
・カードらしく、ふちに${el[0]}ぞくせいの色の飾り枠をつけ、モンスターは枠の中に大きく描く

【図鑑のプロフィール（日本語で）】
・モンスター名：「${m(s.name)}」をもとに、${kind[0]}らしい名前をつける
・図鑑番号：${hashNo()}
・好物：${m(s.food)}
・とくいわざ：「${m(s.habit)}」をヒントに、わざの名前と説明を1つ
・弱点：性格から考えて、クスッと笑えるものを1つ
・${p.extra}
・図鑑の説明文：60字くらいで

画像のあとにプロフィールを書いてください。`;

  const keepEn={
    family:"hairstyle, glasses, favorite clothing colors — features the family would instantly recognize",
    friend:"hairstyle, signature expression, usual outfit — features friends would instantly recognize",
    pet:"fur color, markings, ear and tail shape — features the owner would instantly recognize"
  }[whoKey];
  const moodEn={family:"warm and heartwarming for the whole family",friend:"fun and hype, perfect for sharing with friends",pet:"adorable enough to make the owner smile"}[whoKey];

  const en=
`Using the ${m(subjEn)} in the attached photo as the model, create a Halloween "monster encyclopedia" card.

[Illustration]
- Keep the ${keepEn}
- Transform them into a ${m(kind[1])}
- Element: ${m(el[1])}, visibly swirling around the body
- Personality: ${m(per[1])}, shown through expression and pose
- Style: ${m(st[1])}
- Background: a Halloween night, ${moodEn}
- Portrait image in trading card proportions (aspect ratio 5:7)
- Frame it like a trading card, with an ornate border in ${el[1]}-themed colors and the monster large inside the frame

[Profile, written in Japanese]
- Monster name: based on "${m(s.name)}", fitting a ${kind[1]}
- Entry number: ${hashNo()}
- Favorite food: ${m(s.food)}
- Signature move: inspired by "${m(s.habit)}" — give it a name and a short description
- Weakness: one funny weakness that fits the personality
- ${p.extraEn}

Show the image first, then the profile.`;

  $("spell").innerHTML=lang==="ja"?ja:en;
  $("mname").textContent=s.name;
  $("no").textContent=hashNo();
  const tags=[WHO.find(w=>w.key===whoKey).ja];
  if(isPet) tags.push(sp[0]);
  tags.push(per[0],kind[0],el[0],st[0]);
  $("tags").innerHTML=tags.map(t=>`<span>${esc(t)}</span>`).join("");
}

// ===== イベント =====
$("form").addEventListener("change",e=>{
  if(e.target.name==="who"){ applyWho(WHO[Number(e.target.value)].key); }
  $("toast").textContent=""; build();
});
$("form").addEventListener("input",()=>{ $("toast").textContent=""; build(); });
$("form").addEventListener("submit",e=>e.preventDefault());

function setLang(l){
  lang=l;
  $("tab-ja").setAttribute("aria-selected",l==="ja");
  $("tab-en").setAttribute("aria-selected",l==="en");
  build();
}
$("tab-ja").onclick=()=>setLang("ja");
$("tab-en").onclick=()=>setLang("en");

$("copy").onclick=()=>{
  const text=$("spell").innerText;
  const done=()=>$("toast").textContent="コピーしました。AIに写真と一緒に貼り付けてください。";
  function selectFallback(){
    const range=document.createRange(); range.selectNodeContents($("spell"));
    const sel=getSelection(); sel.removeAllRanges(); sel.addRange(range);
    $("toast").textContent="呪文を選択しました。長押しまたは Ctrl+C でコピーしてください。";
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(selectFallback);
  } else selectFallback();
};

$("swap").onclick=()=>{
  const lists={kind:KIND,element:ELEMENT,style:STYLE};
  const keys=Object.keys(lists);
  const key=keys[Math.floor(Math.random()*keys.length)];
  const cur=Number(document.querySelector(`input[name=${key}]:checked`).value);
  let next=cur;
  while(next===cur) next=Math.floor(Math.random()*lists[key].length);
  check(key,next);
  build();
  const label={kind:"タイプ",element:"ぞくせい",style:"絵のタッチ"}[key];
  $("toast").textContent=`${label}を「${lists[key][next][0]}」に変えました。もう一度AIに送って、違いを比べてみましょう。`;
};

applyWho("pet");
build();
</script>
